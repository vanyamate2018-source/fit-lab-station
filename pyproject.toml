[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-lab-station"
version = "0.1.0"
description = "FIT-LAB modular station"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
ui = [
    "PySide6>=6.8,<7",
]

[project.scripts]
fit-lab-master = "master.gui:main"

[tool.setuptools.packages.find]
include = [
    "master*",
    "receiver*",
    "control*",
    "sdr*",
    "shared*",
    "simulator*",
    "tools*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
