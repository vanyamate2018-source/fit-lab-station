[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-lab-station"
version = "0.3.1"
description = "FIT-LAB modular station"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
ui = [
    "PySide6>=6.8,<7",
    "paramiko>=3.5,<5",
    "PyNaCl>=1.5,<2",
    "keyring>=25,<26; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
fit-lab-master = "master.gui:main"

[tool.setuptools.packages.find]
include = [
    "master*",
    "receiver*",
    "control*",
    "sdr*",
    "shared*",
    "simulator*",
    "tools*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
master = ["assets/*.svg", "assets/*.png", "assets/*.html", "assets/*.webmanifest", "assets/*.js"]
