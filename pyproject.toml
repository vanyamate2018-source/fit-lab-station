[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-lab-station"
version = "0.1.0"
description = "FIT-LAB modular station"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = [
    "master",
    "receiver",
    "control",
    "sdr",
    "shared",
    "simulator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
